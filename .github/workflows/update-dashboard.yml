name: Hanoi PM2.5 Dashboard Update

on:
  workflow_dispatch:
  schedule:
      - cron: "17 */6 * * *"permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_DRIVE_BRIDGE_TOKEN: ${{ secrets.GOOGLE_DRIVE_BRIDGE_TOKEN }}
        run: python run_pipeline.py
