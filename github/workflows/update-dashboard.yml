name: Hanoi PM2.5 Dashboard Update

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours at minute 17 UTC (01:17, 07:17, 13:17, 19:17 Vietnam time)
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: hanoi-pm25-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
      GOOGLE_DRIVE_BRIDGE_TOKEN: ${{ secrets.GOOGLE_DRIVE_BRIDGE_TOKEN }}
      HANOI_PM25_DATA_ROOT: ${{ github.workspace }}/runtime_data
      COLAB_SCHEDULED_RUN: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java for PySpark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration
        shell: bash
        run: |
          test -n "$OPENAQ_API_KEY" || (echo "::error::Missing secret OPENAQ_API_KEY"; exit 1)
          test -n "$GOOGLE_APPS_SCRIPT_URL" || (echo "::error::Missing secret GOOGLE_APPS_SCRIPT_URL"; exit 1)
          test -n "$GOOGLE_DRIVE_BRIDGE_TOKEN" || (echo "::error::Missing secret GOOGLE_DRIVE_BRIDGE_TOKEN"; exit 1)

      - name: Run and sync PM2.5 pipeline
        run: python run_pipeline.py
